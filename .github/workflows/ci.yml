name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter shop-api prisma:generate

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r lint

      - run: pnpm --filter @feneto/nestjs-prisma-uow test:coverage

      - run: pnpm --filter @feneto/nestjs-prisma-uow pack --dry-run

      - name: Push integration test schema
        run: pnpm --filter @feneto/nestjs-prisma-uow exec prisma db push --schema=test/integration/prisma/schema.prisma --skip-generate --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test

      - name: Integration tests
        run: pnpm --filter @feneto/nestjs-prisma-uow test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
